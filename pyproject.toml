[project]
name = "arche"
version = "0.2.0"
description = "state management for small games, with the platform kept at arm's length"
authors = [{ name = "fxxf", email = "fxxf@tutanota.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
window = ["pygame-ce>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "pygame-ce>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arche"]

[tool.pytest.ini_options]
testpaths = ["tests"]
