[package]
name = "arche"
version = "0.1.0"
edition = "2024"
description = "state management for small games, with the platform kept at arm's length"

[dependencies]
crossterm = { version = "0.28", optional = true }
macroquad = { version = "0.4", default-features = false, optional = true }

[features]
terminal = ["dep:crossterm"]
window = ["dep:macroquad"]
